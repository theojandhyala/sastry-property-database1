name: Deploy dashboard to GitHub Pages

# Rebuilds the database from the workbook, reconciles it, regenerates the site
# and publishes it. Because the site is rebuilt here, the published page can
# never lag behind data/source/landlord_10_property_database.xlsx.

on:
  push:
    branches:
      - claude/spreadsheet-to-database-july7p
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build the database from the workbook
        run: python3 scripts/import_xlsx.py

      - name: Reconcile against the workbook
        run: python3 scripts/verify.py

      - name: Generate the site
        run: python3 scripts/build_site.py

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
